[package]
name = "mira"
description = "Mira — a lightweight desktop companion that understands what you're working on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "mira"

[lib]
name = "mira_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["config-json"] }

[dependencies]
mira-core = { workspace = true }
mira-db = { workspace = true }
mira-fs = { workspace = true }
mira-git = { workspace = true }
mira-monorepo = { workspace = true }
mira-platform = { workspace = true }
mira-ports = { workspace = true }
mira-processes = { workspace = true }
mira-scheduler = { workspace = true }
mira-projects = { workspace = true }
mira-workspaces = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
# `sync` for the picker's one-shot reply, `time` for the per-repository read
# timeout, `rt` so Keep Awake can ask which runtime it is on before arming its
# one deadline. No interval, no ticker: nothing here starts a recurring task.
tokio = { version = "1", features = ["rt", "sync", "time"] }
ts-rs = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The keep-awake lifecycle test drives a real `Deadline` against a paused clock,
# so a half-hour span costs no wall time and no real power setting is touched.
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
toml = { workspace = true }
